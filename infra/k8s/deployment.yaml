apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-api
  namespace: ticketflow
  labels:
    app.kubernetes.io/name: ticketflow-api
    app.kubernetes.io/part-of: ticketflow-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticketflow-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ticketflow-api
          image: ticketflow-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DOTNET_EnableDiagnostics
              value: "0"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ticketflow-api
  namespace: ticketflow
  labels:
    app.kubernetes.io/name: ticketflow-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ticketflow-api
