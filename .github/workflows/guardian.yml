name: Guardian DevSecOps
on:
  pull_request:
  push:
    branches: [main]

# P5 — moindre privilege : lecture seule du code par defaut (T20)
permissions:
  contents: read

jobs:
  # ── P5 : Audit de securite du workflow (zizmor + actionlint) ────────────────
  workflow-audit:
    name: Workflow Security Audit (zizmor & actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Install and run actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: Install and run zizmor
        run: |
          pipx install zizmor
          zizmor .github/workflows/

  # ── P4 : Build + Tests (Roslyn -warnaserror — P1 / T20) ──────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab    # v4.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore (locked-mode — T14 supply chain)
        run: dotnet restore --locked-mode
      - name: Build (-warnaserror)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # ── P4 : Secrets scan (tout l'historique — T12) ─────────────────────────────
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (standalone open-source CLI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run Gitleaks scan
        run: gitleaks detect --verbose --redact

  # ── P8 : SCA – OSV-Scanner + dotnet list package --vulnerable (T13 / A03) ──
  sca:
    name: SCA (OSV-Scanner & NuGet Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Requis pour uploader les alertes SARIF de dependances
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab    # v4.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies (locked-mode — T14)
        run: dotnet restore --locked-mode
      - name: Audit NuGet packages (dotnet list package)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-vulnerable.txt
          if grep -qE "(Critical|High)" nuget-vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found in dotnet list package (Critical or High)."
            exit 1
          fi
      - name: Install Google OSV-Scanner
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Run OSV-Scanner (export JSON and SARIF)
        run: |
          osv-scanner scan --recursive --format json . > osv-report.json || true
          osv-scanner scan --recursive --format sarif . > osv-report.sarif || true
          osv-scanner scan --recursive --format table .
      # ── P9 : Enrichissement des findings (EPSS + CISA KEV + atteignabilite) ────
      - name: Enrich findings with EPSS, CISA KEV, and reachability (TicketFlow.Guardian - P9)
        run: |
          dotnet run --project src/TicketFlow.Guardian -- enrich osv-report.json --output findings.enriched.json
      - name: Upload OSV SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          sarif_file: osv-report.sarif
          category: osv-scanner
      - name: Upload Enriched Findings artifact (P9 / P14 Risk Gate feed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: findings-enriched
          path: findings.enriched.json
      - name: Upload SCA dependency reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sca-dependency-reports
          path: |
            nuget-vulnerable.txt
            osv-report.json
            osv-report.sarif
            findings.enriched.json

  # ── P7 : SAST – Semgrep CE & Regles maison (T01, T09, T11) ─────────────────
  sast:
    name: SAST (Semgrep CE & Custom Rules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Requis pour uploader les alertes SARIF dans l'onglet Security
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Install Semgrep CE
        run: pipx install semgrep
      - name: Run Semgrep SAST scan
        run: |
          semgrep scan --config auto --config policies/semgrep/ --sarif --output semgrep.sarif
      - name: Upload SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
      - name: Enforce blocking custom security rules
        run: |
          semgrep scan --config policies/semgrep/ --error

  # ── P10 : Securite des conteneurs (Dockerfile chiseled, Hadolint & Trivy — T15 / A03) ──
  image:
    name: Container Security (Hadolint & Trivy)
    runs-on: ubuntu-latest
    needs: [build-test]
    permissions:
      contents: read
      security-events: write   # Requis pour uploader les alertes SARIF de l'image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Install and run Hadolint (Dockerfile linter)
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint src/TicketFlow.Api/Dockerfile
      - name: Build hardened container image
        run: |
          docker build -t ticketflow-api:${{ github.sha }} -f src/TicketFlow.Api/Dockerfile .
      - name: Install Trivy vulnerability scanner
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | sudo tar -xz -C /usr/local/bin trivy
      - name: Run Trivy container scan (SARIF & JSON)
        run: |
          trivy image --format sarif --output trivy-image.sarif ticketflow-api:${{ github.sha }}
          trivy image --format json --output trivy-image.json ticketflow-api:${{ github.sha }}
          trivy image --severity HIGH,CRITICAL ticketflow-api:${{ github.sha }}
      - name: Upload Trivy container SARIF to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
      - name: Upload Container Image Security Reports
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: container-image-reports
          path: |
            trivy-image.sarif
            trivy-image.json

  # ── P11 : Generation des BOMs (SBOM Syft + CBOM crypto + AIBOM modeles — T13 / T24) ──
  sbom:
    name: BOM Generation (SBOM, CBOM & AIBOM)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab    # v4.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Install Syft CLI
        run: |
          curl -sSL https://github.com/anchore/syft/releases/download/v1.19.0/syft_1.19.0_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin syft
      - name: Generate Software Bill of Materials (SBOM CycloneDX)
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json
      - name: Generate Cryptographic Bill of Materials (CBOM CycloneDX 1.6)
        run: |
          dotnet run --project src/TicketFlow.Guardian -- cbom --output cbom.cdx.json
      - name: Generate AI / Machine Learning Bill of Materials (AIBOM CycloneDX 1.6)
        run: |
          dotnet run --project src/TicketFlow.Guardian -- aibom --output aibom.cdx.json
      - name: Upload BOM artifacts (SBOM, CBOM, AIBOM)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bill-of-materials
          path: |
            sbom.cdx.json
            cbom.cdx.json
            aibom.cdx.json

  # ── P12 : Securite de l'Infrastructure as Code (Checkov sur OpenTofu & Kubernetes — A02 / T20) ──
  iac:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Requis pour uploader les alertes SARIF de Checkov
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38     # v5.4.0
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install --no-cache-dir checkov
      - name: Run Checkov IaC scan
        run: |
          checkov -d infra/ --output sarif --output json --output cli --output-file-path results || true
          if [ -f results/results_sarif.sarif ]; then
            cp results/results_sarif.sarif checkov.sarif
          elif [ -f results_sarif.sarif ]; then
            cp results_sarif.sarif checkov.sarif
          fi
          if [ -f results/results_json.json ]; then
            cp results/results_json.json checkov.json
          elif [ -f results_json.json ]; then
            cp results_json.json checkov.json
          fi
      - name: Upload Checkov SARIF to GitHub Security tab
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b  # v3.28.18
        with:
          sarif_file: checkov.sarif
          category: checkov-iac
      - name: Upload Checkov IaC reports artifact
        if: always() && hashFiles('checkov.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: iac-security-reports
          path: |
            checkov.sarif
            checkov.json

  # ── P14 : Risk Gate OPA / Conftest (Décision basée sur le risque — T13 / T20 / CRA) ──
  risk-gate:
    name: Risk Gate (OPA & Conftest)
    runs-on: ubuntu-latest
    needs: [sca, image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Download enriched findings artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: findings-enriched
          path: .
      - name: Download container scan reports artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: container-image-reports
          path: .
      - name: Install Conftest (Open Policy Agent CLI)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
          chmod +x /usr/local/bin/conftest
          conftest --version
      - name: Verify Rego policy unit tests
        run: |
          conftest verify --policy policies/gate/
      - name: Evaluate Risk Gate policy
        run: |
          files=("findings.enriched.json")
          if [ -f trivy-image.json ]; then
            files+=("trivy-image.json")
          fi
          echo "Evaluating files: ${files[*]}"
          conftest test "${files[@]}" \
            --policy policies/gate/ \
            --data policies/vex/vex.openvex.json \
            --data policies/allowlist/package_allowlist.json \
            --namespace guardian.gate

  # ── P16 / P17 : AI Security Triage Agent avec Garde-fous (T21–T23 / T28 / LLM06) ──
  ai-triage:
    name: AI Security Triage & Remediation (Sandboxed)
    if: failure()
    needs: [risk-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read             # T22/T28 : AUCUN droit d'écriture sur main
      pull-requests: write       # Token restreint à l'ouverture de PR ai-generated
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Download enriched findings artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: findings-enriched
          path: .
      - name: Execute AI triage guardrails check (sandboxed)
        run: |
          echo "=== AI Security Triage Guardrails (P17) ==="
          echo "Token permissions: pull-requests:write only (Zero merge rights)"
          echo "Model pinned: gemini-4-hydrogen (T30)"
          echo "Triage policy: deterministic server-side decision rules"

  # ── X8 : Test de connexion Azure via OIDC (Zero Secret — T20) ───────────────
  cloud-auth-test:
    name: Test Azure OIDC Login
    runs-on: ubuntu-latest
    needs: [build-test, secrets, sca, image, sbom, iac, risk-gate]
    permissions:
      id-token: write   # Requis pour demander le jeton JWT OIDC
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          persist-credentials: false
      - name: Azure login via OIDC (Zero Secret!)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6            # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure CLI access
        run: az account show
