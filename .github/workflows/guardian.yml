name: Guardian DevSecOps
on:
  pull_request:
  push:
    branches: [main]

# P5 — moindre privilege : toutes les permissions read-only par defaut (T20)
permissions: read-all

jobs:
  # ── P4 : Build + Tests ──────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Actions pinnees par SHA — jamais par tag (P5 / T20)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab    # v4.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore (locked-mode — T14 supply chain)
        run: dotnet restore --locked-mode
      - name: Build (-warnaserror)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # ── P4 : Secrets scan (tout l'historique — T12) ─────────────────────────────
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── P4 : SCA — dependances NuGet vulnerables (T13) ──────────────────────────
  sca:
    name: SCA - NuGet Vulnerable Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab    # v4.3.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Check vulnerable packages (block on Critical/High)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee sca-report.txt
          if grep -qE "(Critical|High)" sca-report.txt; then
            echo "::error::Vulnerable NuGet packages found (Critical or High). Fix before merging."
            exit 1
          fi
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sca-report
          path: sca-report.txt
